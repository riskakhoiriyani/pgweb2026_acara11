<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Bantul</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
        }

        #map {
            height: 100vh;
            width: 100%;
        }

        .leaflet-bottom.leaflet-left .legend {
            margin-bottom: 12px;
            margin-left: 12px;
        }

        .legend {
            background: white;
            padding: 8px 10px;
            border-radius: 5px;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.3);
            max-height: 260px;
            overflow-y: auto;
            line-height: 1.3;
        }

        .legend h4 {
            margin: 0 0 6px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var geoserverWms = "http://localhost:8080/geoserver/pgwebbb/wms";
        var layerDesa = "pgwebbb:ADMINISTRASIDESA_AR_25K";
        var layerJalan = "pgwebbb:JALAN_LN_25K";
        var layerTitik = "pgwebbb:TOPONIMI_PT_25K";

        var map = L.map('map').setView([-7.8977, 110.3625], 11);

        var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        var wmsLayer1 = L.tileLayer.wms(geoserverWms, {
            layers: layerDesa,
            format: "image/png",
            transparent: true,
            version: "1.1.0"
        }).addTo(map);

        var wmsLayer2 = L.tileLayer.wms(geoserverWms, {
            layers: layerJalan,
            format: "image/png",
            transparent: true,
            version: "1.1.0"
        }).addTo(map);

        var wmsLayer3 = L.tileLayer.wms(geoserverWms, {
            layers: layerTitik,
            format: "image/png",
            transparent: true,
            version: "1.1.0"
        }).addTo(map);

        map.fitBounds([
            [-8.027838318513016, 110.20372127052524],
            [-7.767702428999936, 110.52130889700008]
        ]);

        var baseMaps = { "OpenStreetMap": osm };
        var overlayMaps = {
            "Administrasi Desa": wmsLayer1,
            "Jalan": wmsLayer2,
            "Titik": wmsLayer3
        };
        L.control.layers(baseMaps, overlayMaps).addTo(map);

        var legend = L.control({ position: 'bottomleft' });

        legend.onAdd = function () {
            var div = L.DomUtil.create('div', 'legend');
            var urlDesa = geoserverWms
                + "?service=WMS&version=1.1.0&request=GetLegendGraphic"
                + "&format=image/png"
                + "&layer=" + layerDesa
                + "&legend_options=fontAntiAliasing:true;forceLabels:on";
            var urlJalan = geoserverWms
                + "?service=WMS&version=1.1.0&request=GetLegendGraphic"
                + "&format=image/png"
                + "&layer=" + layerJalan
                + "&legend_options=fontAntiAliasing:true;forceLabels:on";
            div.innerHTML = '<h4>Legenda: Administrasi Desa</h4>'
                + '<img src="' + urlDesa + '" alt="Legenda Administrasi Desa">'
                + '<h4>Legenda: Jalan</h4>'
                + '<img src="' + urlJalan + '" alt="Legenda Jalan">';
            return div;
        };

        legend.addTo(map);
    </script>
</body>

</html>
